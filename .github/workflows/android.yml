name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 只缓存依赖元数据/jar（modules-2）与 wrapper，不缓存 transforms/build-cache 等可快速
      # 本地重建的大头——整树缓存在依赖变更（toml/build.gradle.kts）后会触发 1.6GiB 级恢复，
      # 曾因超出 actions/cache 下载超时白等 10 分钟（run 34698944841）。
      # key 用 gradle-v2 代际：换缓存路径后避免命中按旧路径打包的历史条目。
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Build with Gradle
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo storeFile=../keystore.jks > signing.properties
            echo storePassword=${{ secrets.KEYSTORE_PASSWORD }} >> signing.properties
            echo keyAlias=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
            echo keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }} >> signing.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > keystore.jks
          fi
          # 无签名 secrets 时 build.gradle.kts 自动回退 debug 签名
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostHush-release
          path: app/build/outputs/apk/release/*.apk
